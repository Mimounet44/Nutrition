// ============================================================
// HISTORIQUE (variation des menus)
// ============================================================
let recentHistory = {};
const HISTORY_LENGTH = 60;

function currentProfileKey(){
  const p = document.getElementById('prenom').value.trim().toLowerCase();
  return p || 'anonyme';
}
function currentDiet(){ return document.getElementById('regime')?.value || 'aucune'; }
function currentStyle(){ return document.getElementById('styleMenu')?.value || 'equilibre'; }
function mealCount(){ return parseInt(document.getElementById('nbRepas')?.value || '4', 10); }
function exclusionsList(){
  return (document.getElementById('exclusions')?.value || '')
    .toLowerCase().split(',').map(x => x.trim()).filter(Boolean);
}
function filterByDiet(arr, diet){
  if (diet === 'vegetarien'){
    const opts = arr.filter(r => r.veg);
    return opts.length ? opts : arr;
  }
  return arr;
}
function compatible(r, diet, exclusions){
  if (diet === 'vegetarien' && !r.veg) return false;
  const hay = `${r.name} ${r.desc} ${(r.ingredients||[]).join(' ')}`.toLowerCase();
  return !exclusions.some(x => hay.includes(x));
}

// Saisonnalité : bonus si les ingrédients principaux sont de saison
function seasonScore(r){
  if (!r.season) return 0;
  const m = new Date().getMonth() + 1;
  return r.season.includes(m) ? -25 : 15; // bonus si saison, pénalité sinon
}

// Score d'une recette pour un idéal kcal + style
function scoreRecipe(r, ideal, style){
  let score = Math.abs(r.kcal - ideal);
  if (style === 'economique') score += r.cost * 90;
  if (style === 'rapide') score += r.time * 5;
  if (style === 'gourmand') score -= Math.min(r.kcal, 550) * .08;
  if (style === 'proteine') score -= (r.p || 0) * 4;
  score += seasonScore(r);
  score += Math.random() * 90;
  return score;
}

// Sélection : évite les plats récents, filtre diet + exclusions
function pickBest(arr, avoidNames, diet, ideal){
  const recent = avoidNames || [];
  const exclusions = exclusionsList();
  let pool = filterByDiet(arr, diet).filter(r => compatible(r, diet, exclusions));
  let fresh = pool.filter(r => !recent.includes(r.name));
  // On garde le pool "frais" s'il reste assez de choix, sinon on relâche
  if (fresh.length >= Math.max(4, Math.floor(pool.length * .25))) pool = fresh;
  if (!pool.length) pool = filterByDiet(arr, diet).filter(r => compatible(r, diet, exclusions));
  if (!pool.length) pool = filterByDiet(arr, diet);
  if (!pool.length) pool = arr.slice();
  return pool.slice().sort((a,b) =>
    scoreRecipe(a, ideal, currentStyle()) - scoreRecipe(b, ideal, currentStyle())
  )[0];
}

// Sauvegarde de l'historique (par profil)
function saveHistory(key, names, prev){
  const arr = (prev || []).concat(names);
  recentHistory[key] = arr.slice(-HISTORY_LENGTH);
}

// ============================================================
// GÉNÉRATION DE MENUS
// ============================================================
function allocateTargets(target, count){
  if (count === 3) return [Math.round(target*.27), Math.round(target*.39), Math.round(target*.34)];
  if (count === 5) return [Math.round(target*.22), Math.round(target*.34), Math.round(target*.28), Math.round(target*.08), Math.round(target*.08)];
  return [Math.round(target*.25), Math.round(target*.35), Math.round(target*.30), Math.round(target*.10)];
}

function generateMenu(target){
  const key = currentProfileKey();
  const recent = recentHistory[key] || [];
  const diet = currentDiet();
  const count = mealCount();
  const targets = allocateTargets(target, count);
  const meals = [];
  const usedToday = [];

  const breakfast = pickBest(RECIPES.petitDej, recent, diet, targets[0]);
  meals.push({type:"Petit-déjeuner", cat:"petitDej", recipe:breakfast});
  usedToday.push(breakfast.name);

  const lunch = pickBest(RECIPES.dejeunerDiner, recent.concat(usedToday), diet, targets[1]);
  meals.push({type:"Déjeuner", cat:"dejeunerDiner", recipe:lunch});
  usedToday.push(lunch.name);

  const dinner = pickBest(RECIPES.dejeunerDiner, recent.concat(usedToday), diet, targets[2]);
  meals.push({type:"Dîner", cat:"dejeunerDiner", recipe:dinner});
  usedToday.push(dinner.name);

  if (count >= 4){
    const snack = pickBest(RECIPES.collation, recent.concat(usedToday), diet, targets[3]);
    meals.push({type:"Collation", cat:"collation", recipe:snack});
    usedToday.push(snack.name);
  }
  if (count >= 5){
    const snack2 = pickBest(RECIPES.collation, recent.concat(usedToday), diet, targets[4]);
    meals.push({type:"Collation", cat:"collation", recipe:snack2});
    usedToday.push(snack2.name);
  }

  const total = meals.reduce((s,m) => s + m.recipe.kcal, 0);
  saveHistory(key, usedToday, recent);
  return {meals, total};
}

function generateWeek(target){
  const week = [];
  // On simule l'ajout à l'historique pour vraiment varier sur 7 jours
  for (let d = 0; d < 7; d++) week.push(generateMenu(target));
  return week;
}

function macroBarHtml(r){
  const total = (r.p*4 + r.c*4 + r.f*9) || 1;
  const p = Math.round(r.p*4/total*100);
  const c = Math.round(r.c*4/total*100);
  const f = Math.max(0, 100 - p - c);
  return `
    <div class="macro-bar">
      <span class="p" style="width:${p}%"></span>
      <span class="c" style="width:${c}%"></span>
      <span class="f" style="width:${f}%"></span>
    </div>
    <div class="macro-legend">Protéines ${r.p}g · Glucides ${r.c}g · Lipides ${r.f}g</div>
  `;
}

function badgesHtml(r){
  let html = '';
  if (r.veg) html += `<span class="badge veg">Végé</span>`;
  if (r.season && r.season.includes(new Date().getMonth()+1)) html += `<span class="badge season">De saison</span>`;
  return html;
}

function mealRowHtml(m, idx, opts={}){
  const r = m.recipe;
  const showSwap = opts.showSwap !== false;
  const ingredientList = (r.ingredients || []).map(x => `<li>${x}</li>`).join('');
  const stepList = (r.steps || []).map(x => `<li>${x}</li>`).join('');
  return `
    <div class="meal-head">
      <div>
        <div class="meal-type">${m.type}${badgesHtml(r)}</div>
        <div class="meal-name">${r.name}</div>
      </div>
      <div class="meal-meta">${r.kcal} kcal · ${r.cost.toFixed(1)} € · ${r.time} min</div>
    </div>
    <div class="meal-desc">${r.desc}</div>
    ${macroBarHtml(r)}
    <div class="meal-actions">
      ${showSwap ? `<button type="button" class="ghost" data-swap="${idx}">Changer ce plat</button>` : ''}
      <button type="button" class="ghost" data-recipe='${JSON.stringify({name:r.name, kcal:r.kcal, p:r.p, c:r.c, f:r.f, time:r.time, cost:r.cost, desc:r.desc, ingredients:r.ingredients||[], steps:r.steps||[]}).replace(/'/g,"&#39;")}'>Voir la recette</button>
    </div>
  `;
}

function recomputeDayTotal(){
  const meals = window._currentMeals || [];
  const total = meals.reduce((s,m) => s + m.recipe.kcal, 0);
  const cost = meals.reduce((s,m) => s + m.recipe.cost, 0);
  const p = meals.reduce((s,m) => s + (m.recipe.p||0), 0);
  const c = meals.reduce((s,m) => s + (m.recipe.c||0), 0);
  const f = meals.reduce((s,m) => s + (m.recipe.f||0), 0);
  document.getElementById('dayTotal').textContent = `${total} kcal · env. ${cost.toFixed(1)} € · P${p}g / G${c}g / L${f}g`;
}

function renderMenu(target){
  const { meals } = generateMenu(target);
  window._currentMeals = meals;
  window._currentTarget = target;
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  meals.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = 'meal';
    div.innerHTML = mealRowHtml(m, idx);
    list.appendChild(div);
  });
  recomputeDayTotal();
  document.getElementById('menuCard').classList.remove('hidden');
  document.getElementById('addRecipeCard').classList.remove('hidden');
  document.getElementById('shoppingCard').classList.add('hidden');
}

  document.getElementById('shoppingCard').classList.add('hidden');

// Remplace un seul repas (corrigé : utilise pickBest)
function swapMeal(idx){
  const key = currentProfileKey();
  const recent = recentHistory[key] || [];
  const diet = currentDiet();
  const m = window._currentMeals[idx];
  if (!m) return;
  const otherNamesToday = window._currentMeals.filter((_, i) => i !== idx).map(x => x.recipe.name);
  const newRecipe = pickBest(RECIPES[m.cat], recent.concat(otherNamesToday, [m.recipe.name]), diet, m.recipe.kcal);
  if (!newRecipe) return;
  window._currentMeals[idx] = { ...m, recipe: newRecipe };
  saveHistory(key, [newRecipe.name], recent);

  const list = document.getElementById('menuList');
  const div = list.children[idx];
  if (div) div.innerHTML = mealRowHtml(window._currentMeals[idx], idx);
  recomputeDayTotal();
}

// Formulaire profil
document.getElementById('profileForm').addEventListener('submit', function(e){
  e.preventDefault();
  const poids = parseFloat(document.getElementById('poids').value);
  const taille = parseFloat(document.getElementById('taille').value);
  const age = parseFloat(document.getElementById('age').value);
  const sexe = document.querySelector('input[name=sexe]:checked').value;
  const activite = parseFloat(document.getElementById('activite').value);
  const deficit = parseFloat(document.getElementById('objectif').value);
  const regime = document.getElementById('regime').value;

  let bmr = (sexe === 'homme')
    ? 10*poids + 6.25*taille - 5*age + 5
    : 10*poids + 6.25*taille - 5*age - 161;
  const maintien = bmr * activite;
  let cible = maintien - deficit;
  if (cible < bmr) cible = bmr;

  document.getElementById('bmrVal').textContent = Math.round(bmr);
  document.getElementById('maintienVal').textContent = Math.round(maintien);
  document.getElementById('cibleVal').textContent = Math.round(cible);
  document.getElementById('resultCard').classList.remove('hidden');

  window._profile = { prenom: document.getElementById('prenom').value.trim(), poids, taille, age, sexe, activite, deficit, regime, nbRepas: mealCount(), styleMenu: currentStyle(), exclusions: exclusionsList().join(', '), bmr, maintien, cible };
  renderMenu(Math.round(cible));
});

document.getElementById('btnShopping').addEventListener('click', () => {
  const meals = window._currentMeals || [];
  const counts = {};
  meals.forEach(m => {
    (m.recipe.ingredients || []).forEach(ing => {
      const clean = ing.replace(/^\d+([.,]\d+)?\s*(g|ml|cl|l|kg)?\s*/i, '').trim();
      const key = clean.toLowerCase();
      if (!counts[key]) counts[key] = { label: clean, count: 0 };
      counts[key].count++;
    });
  });
  const html = Object.values(counts)
    .sort((a,b) => a.label.localeCompare(b.label))
    .map(x => `<div>☐ ${x.label}${x.count > 1 ? ` <em>×${x.count}</em>` : ''}</div>`)
    .join('');
  document.getElementById('shoppingList').innerHTML = html || '<div>Aucun ingrédient à lister.</div>';
  document.getElementById('shoppingCard').classList.remove('hidden');
  document.getElementById('shoppingCard').scrollIntoView({behavior:'smooth'});
});

document.getElementById('btnLoad').addEventListener('click', async function(){
  const status = document.getElementById('saveStatus');
  const key = currentProfileKey();
  if (!db){ status.textContent = "Firebase non configuré — impossible de charger un profil."; return; }
  if (key === 'anonyme'){ status.textContent = "Indique d'abord un prénom."; return; }
  try {
    const doc = await db.collection('profils').doc(key).get();
    if (!doc.exists){ status.textContent = `Aucun profil trouvé pour "${document.getElementById('prenom').value.trim()}".`; return; }
    const data = doc.data();
    const set = (id, v) => { if (v !== undefined && v !== null) document.getElementById(id).value = v; };
    set('poids', data.poids); set('taille', data.taille); set('age', data.age);
    if (data.sexe) { const el = document.querySelector(`input[name=sexe][value=${data.sexe}]`); if (el) el.checked = true; }
    set('activite', data.activite); set('objectif', data.deficit); set('regime', data.regime);
    set('nbRepas', data.nbRepas); set('styleMenu', data.styleMenu); set('exclusions', data.exclusions);
    if (data.recentMeals) recentHistory[key] = data.recentMeals;
    let added = 0;
    if (Array.isArray(data.customRecipes)){
      data.customRecipes.forEach(r => {
        if (r && r.cat && RECIPES[r.cat] && !RECIPES[r.cat].some(e => e.name === r.name)){
          RECIPES[r.cat].push({ name:r.name, kcal:r.kcal, cost:r.cost, time:r.time, desc:r.desc, veg:!!r.veg, p:r.p||0, c:r.c||0, f:r.f||0, ingredients:r.ingredients||[], steps:r.steps||[] });
          added++;
        }
      });
    }
    status.textContent = "Profil chargé ✓" + (added ? ` (+${added} recette(s) perso)` : "") + ` — clique sur "Calculer mon objectif".`;
  } catch(err){ status.textContent = "Erreur de chargement : " + err.message; }
});

document.getElementById('btnSave').addEventListener('click', async function(){
  const status = document.getElementById('saveStatus');
  if (!db){ status.textContent = "Firebase non configuré — profil non enregistré."; return; }
  const key = currentProfileKey();
  try {
    await db.collection('profils').doc(key).set({
      ...window._profile,
      recentMeals: recentHistory[key] || [],
      updatedAt: new Date().toISOString()
    }, { merge: true });
    status.textContent = "Profil enregistré ✓";
  } catch(err){ status.textContent = "Erreur d'enregistrement : " + err.message; }
});

document.getElementById('addRecipeForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const status = document.getElementById('addRecipeStatus');
  const cat = document.getElementById('rCategorie').value;
  const ingredients = (document.getElementById('rIngredients').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  const steps = (document.getElementById('rSteps').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  const recipe = {
    name: document.getElementById('rNom').value.trim(),
    kcal: parseFloat(document.getElementById('rKcal').value),
    cost: parseFloat(document.getElementById('rCost').value),
    time: parseFloat(document.getElementById('rTime').value),
    desc: document.getElementById('rDesc').value.trim() || "Recette ajoutée par toi.",
    veg: document.getElementById('rVeg').checked,
    p: 0, c: 0, f: 0,
    ingredients, steps,
    cat
  };
  if (!recipe.name || !recipe.kcal || !recipe.cost || !recipe.time){
    status.textContent = "Merci de remplir au moins le nom, les calories, le coût et le temps."; return;
  }
  if (RECIPES[cat].some(r => r.name === recipe.name)){
    status.textContent = "Une recette porte déjà ce nom dans cette catégorie."; return;
  }
  RECIPES[cat].push({ ...recipe });
  document.getElementById('addRecipeForm').reset();

  const key = currentProfileKey();
  if (db && key !== 'anonyme'){
    try {
      await db.collection('profils').doc(key).set({
        customRecipes: firebase.firestore.FieldValue.arrayUnion(recipe)
      }, { merge: true });
      status.textContent = `"${recipe.name}" ajoutée ✓ — elle sera retrouvée à ton prochain chargement.`;
    } catch(err){
      status.textContent = `"${recipe.name}" ajoutée en session, non sauvegardée (${err.message}).`;
    }
  } else {
    status.textContent = `"${recipe.name}" ajoutée pour cette session.`;
  }
});

function renderBudgetWeek(){
  const budget = parseFloat(document.getElementById('weekBudget').value) || 80;
  const people = parseInt(document.getElementById('weekPeople').value) || 2;
  const factor = people / 2;
  const r = document.getElementById('budgetWeekResult');
  let html = `<div class="budget-total"><span>Semaine pour ${people} personne(s)</span><span>Budget cible : ${budget.toFixed(0)} €</span></div>`;
  WEEK_2P_80.forEach(d => {
    html += `<div class="week-day"><h3>${d.day}</h3>`;
    d.meals.forEach(m => {
      html += `<div class="meal"><div class="meal-head"><div><div class="meal-type">${m.type}</div><div class="meal-name">${m.name}</div></div><div class="meal-meta">${Math.round(m.kcal)} kcal</div></div>`;
      html += `<div class="recipe-box"><h4>Recette pour ${people} personne(s)</h4><strong>Ingrédients</strong><ul>${m.ingredients.map(x => `<li>${x}${people===2?'':' × '+factor.toFixed(1)}</li>`).join('')}</ul><strong>Préparation</strong><ol>${m.steps.map(x => `<li>${x}</li>`).join('')}</ol></div></div>`;
    });
    html += `</div>`;
  });
  const baseTotal = SHOPPING_80.reduce((sum,x) => {
    const m = x.match(/~([0-9]+(?:,[0-9]+)?) €/);
    return sum + (m ? parseFloat(m[1].replace(',','.')) : 0);
  }, 0);
  const estimated = baseTotal * factor;
  html += `<div class="budget-total"><span>Courses estimées</span><span>~ ${estimated.toFixed(0)} €</span></div>`;
  html += `<h3 style="margin-top:1.3rem;">🛒 Liste de courses</h3><div class="shopping">${SHOPPING_80.map(x => `<div>☐ ${x}</div>`).join('')}</div>`;
  r.innerHTML = html;
  r.classList.remove('hidden');
}
document.getElementById('btnBudgetWeek').addEventListener('click', renderBudgetWeek);
